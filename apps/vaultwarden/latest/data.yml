additionalProperties:
  formFields:
    - default: 8000                     # 默认值
      edit: true                        # 是否可被编辑
      envKey: PANEL_APP_PORT_HTTP       # 映射到的环境变量键名
      labelEn: Port                     
      labelZh: 端口                      
      required: true                    # 是否为必填项
      rule: paramPort                   # 校验规则
      type: number                      # 字段类型

    - default: ./data                   # 默认值
      edit: true                        # 是否可被编辑
      envKey: DATA_PATH                 # 映射到的环境变量键名
      labelEn: data path         
      labelZh: 数据文件夹路径            
      required: true                    # 是否为必填项：是
      type: text                        # 字段类型

    - default: https://vw.domain.tld    # 默认值
      edit: true                        # 是否可被编辑
      envKey: DOMAIN                    # 映射到的环境变量键名
      labelEn: DOMAIN         
      labelZh: 数据文件夹路径            
      required: true                    # 是否为必填项：是
      type: text                        # 字段类型