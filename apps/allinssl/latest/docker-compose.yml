services:
  tgdrive:
    image: allinssl/allinssl:latest             # 使用的镜像，latest 表示始终使用最新版本
    container_name: ${CONTAINER_NAME}           # 容器名称，从环境变量 CONTAINER_NAME 获取
    ports:
      - "${PANEL_APP_PORT_HTTP}:8888"           # 映射主机端口到容器
    volumes:
      - ${DATA_PATH}:/www/allinssl/data         # 映射本地数据目录到容器内，用于持久化数据库数据
    restart: always                             # 容器异常退出时自动重启
    networks:
      - 1panel-network                          # 使用名为 1panel-network 的 Docker 网络

    environment:
      - PUID=0                                  # 设置容器进程的用户 ID 为 0（root 用户）
      - PGID=0                                  # 设置容器进程的用户组 ID 为 0（root 用户组）
      - UMASK=022                               # 设置文件权限掩码，新建文件默认权限为 755
      - ALLINSSL_USER=${ALLINSSL_USER}          # 用户名 从环境变量 ALLINSSL_USER 获取
      - ALLINSSL_PWD=${ALLINSSL_PWD}            # 密码 从环境变量 ALLINSSL_PWD 获取
      - ALLINSSL_URL=${ALLINSSL_URL}            # 访问路径 从环境变量 ALLINSSL_URL 获取
      - TZ=${ALLINSSL_TZ}                       # 时区 从环境变量 ALLINSSL_TZ 获取

    tty: true
    stdin_open: true

networks:
  1panel-network:
    external: true                              # 使用已存在的外部网络，方便与其他服务通信